<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Success! — Pranjali Sachan</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body { 
      background: #f8f9fa;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .success-card {
      background: white;
      padding: 60px 40px;
      border-radius: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.05);
      max-width: 500px;
      width: 90%;
    }
    .success-icon {
      width: 80px;
      height: 80px;
      background: rgba(255, 194, 0, 0.1);
      color: #ffc200;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin: 0 auto 30px;
    }
    .btn-gold {
      background: #ffc200;
      color: #000;
      font-weight: 700;
      border-radius: 12px;
      padding: 12px 30px;
      border: none;
      transition: all 0.3s ease;
    }
    .btn-gold:hover {
      background: #212121;
      color: #fff;
      transform: translateY(-3px);
    }
    /* Dark mode support */
    .dark-mode body { background: #111; }
    .dark-mode .success-card { background: #1a1a1a; color: #fff; }
  </style>
</head>
<body>
  <div class="success-card">
    <div class="success-icon">
      <i class="bi bi-check-lg"></i>
    </div>
    <h2 class="mb-3">Message Received!</h2>
    <p class="text-muted mb-5">Thanks for reaching out, Pranjali. I've received your message and will get back to you within 24 hours.</p>
    <a href="index.html" class="btn btn-gold">
      <i class="bi bi-arrow-left mr-2"></i> Back to Website
    </a>
  </div>

  <script>
    // Inherit dark mode if active
    if (localStorage.getItem('color-mode') === 'dark') {
      document.body.classList.add('dark-mode');
    }
  </script>
</body>
</html>
